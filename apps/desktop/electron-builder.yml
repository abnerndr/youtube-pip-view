appId: com.ytview.app
productName: YTView
directories:
  buildResources: build
  # Não pode ser "dist": é lá que o Vite põe o renderer, que entra no pacote.
  # Com os dois no mesmo lugar, cada build empacotava o app anterior dentro
  # do novo (o asar chegou a 258 MB).
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
extraMetadata:
  main: dist-electron/electron-loader.cjs
icon: build/icon.png
mac:
  category: public.app-category.entertainment
  icon: build/icon.png
  target:
    - dmg
    - zip
dmg:
  title: ${productName}-${version}
forceCodeSigning: false
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: YTView
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
linux:
  icon: build/icon.png
  category: AudioVideo
  maintainer: YTView contributors
  desktop:
    Name: YTView
    Comment: Floating YouTube Picture-in-Picture player
    Categories: AudioVideo;Player;Video;
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-${arch}.${ext}
